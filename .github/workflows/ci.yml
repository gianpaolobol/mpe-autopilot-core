name: core-ci

on:
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'refactor/**'
      - 'hardening/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Control-plane smoke probe
        env:
          AUTOPILOT_CONTROLLER_SHA: ${{ github.sha }}
        run: >-
          python -m autopilot_core probe
          --root "$RUNNER_TEMP/autopilot-core-probe"
          --runner-id github-ci
